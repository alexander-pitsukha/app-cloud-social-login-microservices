server:
  port: 8083
  forward-headers-strategy: framework

logging:
  level:
    web: INFO

spring:
  datasource:
    url: jdbc:sqlite:memory:db?date_class=TEXT
    driver-class-name: org.sqlite.JDBC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    properties:
      hibernate:
        dialect: org.sqlite.hibernate.dialect.SQLiteDialect
    hibernate:
      ddl-auto: none
    show-sql: true

app:
  auth:
    token-secret: ${JWT_TOKEN_SECRET}
