server:
  port: 8082
  forward-headers-strategy: framework

logging:
  level:
    web: DEBUG

spring:
  security:
    oauth2:
      client:
        registration:
          linkedin:
            clientSecret: <your-client-secret>
            provider: linkedin
            client-name: Linkedin
            clientId: ${LINKEDIN_CLIENT_ID}
            redirect-uri: ${gateway.service.url}
            authorization-grant-type: authorization_code
            scope: r_liteprofile, r_emailaddress
            client-authentication-method: post
          google:
            clientId: ${GOOGLE_CLIENT_ID}
            clientSecret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: ${gateway.service.url}
          facebook:
            clientSecret: ${FACEBOOK_CLIENT_SECRET}
            clientId: ${FACEBOOK_CLIENT_ID}
            redirect-uri: ${gateway.service.url}
          github:
            clientSecret: ${GITHUB_CLIENT_SECRET}
            clientId: ${GITHUB_CLIENT_ID}
            redirect-uri: ${gateway.service.url}
        provider:
          linkedin:
            authorization-uri: https://www.linkedin.com/oauth/v2/authorization
            token-uri: https://www.linkedin.com/oauth/v2/accessToken
            user-info-uri: https://api.linkedin.com/v2/me
            user-name-attribute: id
          facebook:
            user-info-uri: https://graph.facebook.com/me?fields=id,name,email,picture
  mail:
    username: ${USERNAME_MAIL}
    port: 465
    properties:
      mail:
        smtps:
          auth: true
          starttls:
            enable: true
          timeout: 8000
        transport:
          protocol: smtps
    host: smtp.gmail.com
    protocol: smtps
    password: secret
  datasource:
    url: jdbc:hsqldb:mem:db;DB_CLOSE_DELAY=-1
    driver-class-name: org.hsqldb.jdbc.JDBCDriver
    username: sa
    password: sa
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.HSQLDialect
    show-sql: true
    hibernate:
      ddl-auto: update

app:
  client:
    base-url: http://localhost:8081/
  oauth-2:
    authorized-redirect-uris: http://localhost:8081/oauth2/redirect,myandroidapp://oauth2/redirect,myiosapp://oauth2/redirect
  auth:
    token-expiration-msec: ${JWT_TOKEN_EXPIRATION_MSE}
    token-secret: ${JWT_TOKEN_SECRET}

gateway:
  service:
    url: http://localhost:8080/login/oauth2/code/{registrationId}

linkedin:
  email-address-uri: https://api.linkedin.com/v2/emailAddress?q=members&projection=(elements*(handle~))

support:
  email: ${SUPPORT_EMAIL}
