server:
  port: 8080

logging:
  level:
    web: DEBUG

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      global-cors:
        cors-configurations:
          '[/**]':
            allowed-origins: '*'
            allowed-headers: '*'
            allowed-methods: '*'
        add-to-simple-url-handler-mapping: true

app:
  auth:
    token-expiration-msec: ${JWT_TOKEN_EXPIRATION_MSE}
    token-secret: ${JWT_TOKEN_SECRET}
