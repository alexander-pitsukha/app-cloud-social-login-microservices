server:
  port: 8080

logging:
  level:
    web: DEBUG

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      global-cors:
        cors-configurations:
          '[/**]':
            allowed-origins: '*'
            allowed-headers: '*'
            allowed-methods: '*'
        add-to-simple-url-handler-mapping: true

gateway:
  security:
    open-api-endpoints:
      - /auth/signup
      - /auth/signin
      - /oauth2/authorization
      - /login/oauth2/code/

app:
  auth:
    token-expiration-msec: ${JWT_TOKEN_EXPIRATION_MSE}
    token-secret: ${JWT_TOKEN_SECRET}
